[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-auditor-local"
version = "0.1.0"
description = "Auditor local de citas RAG contra el corpus"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = ["pytest>=8.0.0", "rich>=13.7.0"]

[project.scripts]
citation-auditor = "citation_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
